<!doctype html>
<html><head><meta charset="utf-8"><title>Music 3 · Oscilloscope</title>
<link rel="stylesheet" href="../styles/toxic.css">
<style>
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:url(game.webp) center/cover}
.mu{position:absolute;left:905px;top:928px;width:560px;height:120px;display:grid;grid-template-columns:1fr 150px;gap:12px;padding:10px 12px}
.scr{position:relative;border-radius:8px;background:radial-gradient(ellipse at center,#06200a 0%,#020803 75%);box-shadow:inset 0 0 18px #000, 0 0 0 1px rgba(168,255,31,.3);overflow:hidden}
.scr canvas{position:absolute;inset:0;width:100%;height:100%}
.inf{display:grid;align-content:center;gap:4px;min-width:0}
.inf img{width:40px;height:40px;border-radius:4px}
.t{font:700 14px/1.2 Inter,sans-serif;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font:800 11px Oxanium,sans-serif;letter-spacing:.16em;color:var(--acid);text-transform:uppercase}
.r{font:700 11px 'Share Tech Mono',Consolas,monospace;color:var(--mute)}
.lbl{position:absolute;left:24px;top:24px;font:800 28px Oxanium,sans-serif;color:#fff;text-shadow:0 2px 8px #000}
</style></head><body>
<div id="stage" class="gx">
  <div class="lbl">3 · OSCILLOSCOPE — CRT screen, grid, phosphor trace</div>
  <div class="pn slime mu">
    <div class="scr"><canvas id="c" width="386" height="100"></canvas></div>
    <div class="inf"><img id="cv" alt=""><div class="t" id="tt"></div><div class="a" id="ar"></div><div class="r">CH1 · 5ms/div</div></div>
  </div>
</div>
<script type="module">
import { NOW, getWave, cover, stageFit } from './music-shared.js';
stageFit(stage);
cv.src = cover(80); tt.textContent = NOW.album; ar.textContent = NOW.artist;
const g = c.getContext('2d'), W = c.width, H = c.height;
const grid = () => {
  g.strokeStyle = 'rgba(168,255,31,.12)'; g.lineWidth = 1;
  for (let x = 0; x <= W; x += W / 10) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y <= H; y += H / 4) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.strokeStyle = 'rgba(168,255,31,.28)'; g.beginPath(); g.moveTo(0, H / 2); g.lineTo(W, H / 2); g.stroke();
};
(function draw() {
  g.fillStyle = 'rgba(2,8,3,.35)'; g.fillRect(0, 0, W, H);   // phosphor persistence
  grid();
  const w = getWave(256), mid = H / 2;
  g.beginPath();
  w.forEach((v, i) => { const x = i / (w.length - 1) * W, y = mid - v * mid * .85; i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.strokeStyle = '#c8ff6a'; g.lineWidth = 1.6; g.shadowColor = '#a8ff1f'; g.shadowBlur = 12; g.stroke(); g.shadowBlur = 0;
  requestAnimationFrame(draw);
})();
</script></body></html>
