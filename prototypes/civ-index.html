<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dressed for War: all civs</title>
<style>
:root{--bg:#0b0d09;--card:#151912;--line:#2a3123;--ink:#e6eadf;--dim:#8d977f;--acid:#a8ff1f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.4 system-ui,sans-serif;padding:28px 32px 60px}
h1{margin:0 0 4px;font:800 30px/1.1 system-ui,sans-serif;letter-spacing:.02em}
h1 b{color:var(--acid)}
.sub{color:var(--dim);margin:0 0 26px}
section{margin:0 0 30px}
h2{display:flex;align-items:baseline;gap:12px;margin:0 0 12px;font:700 18px/1.2 system-ui,sans-serif}
h2 small{font-weight:500;color:var(--dim);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
a.c{position:relative;display:block;color:inherit;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
a.c:hover{transform:translateY(-3px);border-color:var(--a,var(--acid));box-shadow:0 10px 30px -12px var(--a,var(--acid))}
a.c .im{aspect-ratio:640/460;background:#000 center/cover no-repeat}
a.c .im.none{display:grid;place-items:center;color:var(--dim);font-size:12px;background:repeating-linear-gradient(45deg,#111 0 10px,#151515 10px 20px)}
a.c .t{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:3px solid var(--a,#333)}
a.c .t i{width:10px;height:10px;border-radius:50%;background:var(--a,#333);box-shadow:0 0 8px var(--a,transparent)}
a.c.err .t{border-top-color:#f33}
a.c.err .t::after{content:'module error';margin-left:auto;color:#f66;font-size:11px}
</style>
</head>
<body>
<h1>Dressed for <b>War</b></h1>
<p class="sub">56 ranked civs, 14 regional kits. Each card opens the prototype page (D dress, G green, R replay). Thumbnails are the latest dressed captures.</p>
<main id="m"></main>
<script type="module">
import { KITS } from './dress/civs.js';
const m = document.getElementById('m');
const v = Date.now();
m.innerHTML = KITS.map(([kit, label, mat, civs]) => `<section><h2>${label} <small>${mat} · ${civs.length}</small></h2><div class="grid">${
  civs.map(([id, n]) => `<a class="c" href="civ-${id}.html" data-id="${id}"><div class="im" style="background-image:url(../.claude/dress-shots/${id}-c0.png?${v})"></div><div class="t"><i></i>${n}</div></a>`).join('')
}</div></section>`).join('');
for (const a of m.querySelectorAll('a.c')) {
  const id = a.dataset.id, im = a.querySelector('.im');
  const probe = new Image(); probe.onerror = () => { im.classList.add('none'); im.textContent = 'no capture yet'; }; probe.src = `../.claude/dress-shots/${id}-c0.png?${v}`;
  import(`./dress/civ-${id}.js`).then((mod) => a.style.setProperty('--a', mod.default.accent)).catch(() => a.classList.add('err'));
}
</script>
</body>
</html>
