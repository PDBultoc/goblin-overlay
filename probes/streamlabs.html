<!doctype html><meta charset="utf-8"><title>Probe Streamlabs socket</title>
<style>body{font:14px monospace;background:#111;color:#cfc;padding:12px}input{width:420px}pre{white-space:pre-wrap;background:#000;padding:8px}</style>
<h3>Probe: Streamlabs Socket API</h3>
<p>Paste YOUR socket token (stays in this tab only): <input id="tok" type="password"> <button id="go">Connect</button></p>
<p id="st">not connected</p><button id="cp">Copy log</button><pre id="log"></pre>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.3.0/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id), log = [];
const add = (k, x) => { log.push({ k, t: new Date().toISOString(), x }); $('log').textContent = JSON.stringify(log, null, 1); };
$('go').onclick = () => {
  const s = io('https://sockets.streamlabs.com?token=' + encodeURIComponent($('tok').value.trim()), { transports: ['websocket'] });
  s.on('connect', () => { $('st').textContent = 'CONNECTED'; add('connect'); });
  s.on('connect_error', e => { $('st').textContent = 'ERROR ' + e; add('connect_error', String(e)); });
  s.on('disconnect', r => add('disconnect', r));
  s.on('event', e => add('event', e));
};
$('cp').onclick = () => navigator.clipboard.writeText(JSON.stringify(log, null, 1));
</script>
