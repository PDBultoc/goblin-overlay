<!doctype html>
<html><head><meta charset="utf-8"><title>Music 3 · Goblin Radio</title>
<link rel="stylesheet" href="../styles/toxic.css">
<style>
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:url(game.webp) center/cover}
.mu{position:absolute;left:905px;top:928px;width:560px;height:120px;display:grid;grid-template-columns:112px 1fr;gap:10px;padding:4px 14px 4px 4px;overflow:visible}
.disc{position:relative;width:112px;height:112px}
.disc canvas{position:absolute;inset:0;width:112px;height:112px}
.disc img{position:absolute;left:31px;top:31px;width:50px;height:50px;border-radius:50%;animation:spin 5s linear infinite;box-shadow:0 0 0 2px #061003}
@keyframes spin{to{transform:rotate(360deg)}}
.rt{display:grid;grid-template-rows:auto auto 1fr;padding-top:10px;min-width:0}
.k{font:800 12px/1 Oxanium,sans-serif;letter-spacing:.2em;color:var(--acid)}
.k b{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff3b3b;margin-right:6px;animation:on 1.2s steps(2) infinite}
@keyframes on{50%{opacity:.2}}
.t{font:800 20px/1.25 Oxanium,sans-serif;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.03em}
#m{width:100%;height:100%;display:block}
.lbl{position:absolute;left:24px;top:24px;font:800 28px Oxanium,sans-serif;color:#fff;text-shadow:0 2px 8px #000}
</style></head><body>
<div id="stage" class="gx">
  <div class="lbl">3 · GOBLIN RADIO — radial ring + neon mountain wave</div>
  <div class="pn slime mu">
    <div class="disc"><canvas id="r" width="224" height="224"></canvas><img id="cv" alt=""></div>
    <div class="rt">
      <div class="k"><b></b>GOBLIN RADIO · NOW PLAYING</div>
      <div class="t" id="tt"></div>
      <canvas id="m" width="420" height="52"></canvas>
    </div>
  </div>
</div>
<script type="module">
import { NOW, getSpectrum, getWave, cover, stageFit } from './music-shared.js';
stageFit(stage);
cv.src = cover(100); tt.textContent = NOW.title;
const rg = r.getContext('2d'), mg = m.getContext('2d');
(function draw() {
  // radial spectrum ring around the spinning cover
  const sp = getSpectrum(64), cx = 112, cy = 112;
  rg.clearRect(0, 0, 224, 224);
  rg.strokeStyle = '#a8ff1f'; rg.lineWidth = 4; rg.shadowColor = '#a8ff1f'; rg.shadowBlur = 8;
  sp.forEach((v, i) => {
    const a = i / sp.length * Math.PI * 2 - Math.PI / 2, r0 = 62, r1 = r0 + 6 + v * 40;
    rg.beginPath(); rg.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); rg.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); rg.stroke();
  });
  // filled neon "mountain" wave under the title
  const w = getWave(120), H = m.height;
  mg.clearRect(0, 0, m.width, H);
  const gr = mg.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, 'rgba(168,255,31,.85)'); gr.addColorStop(1, 'rgba(168,255,31,.05)');
  mg.beginPath(); mg.moveTo(0, H);
  w.forEach((v, i) => mg.lineTo(i / (w.length - 1) * m.width, H - (0.15 + Math.abs(v)) * H * 0.95));
  mg.lineTo(m.width, H); mg.closePath(); mg.fillStyle = gr; mg.fill();
  requestAnimationFrame(draw);
})();
</script></body></html>
